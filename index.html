<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte, Futuro Sustentável</title>
    <style>
        /* Configurações Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f5;
            color: #333;
            line-height: 1.6;
        }

        /* Cabeçalho */
        header {
            background-color: #2c5e3b;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        header p {
            font-size: 1.3rem;
            font-weight: 300;
            color: #a3e2a2;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Container Principal */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Seção de Introdução */
        .intro {
            background-color: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            border-left: 5px solid #4caf50;
        }

        .intro h2 {
            color: #2c5e3b;
            margin-bottom: 15px;
        }

        /* Grid de Pilares */
        .pilares-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .pilar-card {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pilar-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.1);
        }

        .pilar-card h3 {
            color: #2c5e3b;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        /* Seção de Destaque/Ação */
        .cta-section {
            background-color: #e8f5e9;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #c8e6c9;
        }

        .cta-section h2 {
            color: #2c5e3b;
            margin-bottom: 15px;
        }

        .cta-section p {
            max-width: 700px;
            margin: 0 auto;
            font-size: 1.1rem;
        }

        /* Rodapé */
